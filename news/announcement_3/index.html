  <!-- this is the main code for scrollspy. not the bootstrap version -->
<script type="text/javascript">
  $(document).ready(() => {
    const sections = document.querySelectorAll("body > .container > div");
    const navItems = document.querySelectorAll("#navbarNav > ul > li");

    window.addEventListener("scroll", () => {
      let fromTop = window.scrollY + 500;

      let currentSection = null;
      sections.forEach((section) => {
        if (
          section.offsetTop <= fromTop &&
          section.offsetTop + section.offsetHeight > fromTop
        ) {
          currentSection = section;
        }
      });

      // Remove tabHigh class from all navItems
      navItems.forEach((item) => {
        item.classList.remove("tabHigh");
      });

      // Add tabHigh class to the corresponding navItem
      if (currentSection) {
        const id = currentSection.getAttribute("id");
        const targetLink = document.querySelector(
          `#navbarNav > ul > li a[href='/#${id}']`
        );
        if (targetLink) {
          targetLink.parentElement.classList.add("tabHigh");
        }
      }
    });
  });
</script>
