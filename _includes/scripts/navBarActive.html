<script type="text/javascript">
  const navLinks = document.getElementsByClassName("nav-item");
  for (let i = 0; i < navLinks.length; i++) {
    navLinks[i].onclick = function () {
      var ele = navLinks[0];
      while (ele) {
        if (ele.tagName == "LI") {
          ele.classList.remove("active");
        }

        ele = ele.nextSibling;
      }
      navLinks[i].classList.add("active");
    };
  }
</script>
